name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Select and validate release channel
        id: channel
        run: node scripts/release-channel.mjs

      - name: Update npm (trusted publishing requires >= 11.5)
        run: npm install -g npm@11.5.2

      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        # npm >=11.6 skips dependency install scripts by default; force the better-sqlite3 build
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Synthetic memory demo
        run: npm run demo:memory

      - name: Build distributable
        run: npm run build

      - name: Verify Codex release contract
        run: npm run verify:codex-release -- --check-packed

      - name: Publish to npm with provenance
        env:
          NPM_DIST_TAG: ${{ steps.channel.outputs.npm_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists - skipping (idempotent re-run)"
          else
            if [ "$PRERELEASE" = "true" ]; then
              release_flags=(--prerelease --latest=false)
            else
              release_flags=(--latest)
            fi
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes "${release_flags[@]}"
          fi
